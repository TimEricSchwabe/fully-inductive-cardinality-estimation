data:
  - dataset: "orthogonal"
    queries: "orthogonal_queries"
    batch_size: 64
    num_queries: 20000
    type: "train-val"

  - dataset: "two_clusters"
    queries: "two_clusters_queries"
    batch_size: 64
    num_queries: 20000
    type: "train-val"

epochs: 200
wandb: False
wandb_run_name: "RelationalGNN-custom"
learning_rate: 1e-4
train_ratio: 0.8
output_dir: "output/"
save_every: 5
save_metrics_every: 1
eval_every: 1
seed: 42
device: "auto"
weight_decay: 0.00
n_embedding_layers: 4
GNNNeighborhood: [100, 100]
Conditioning: "all"
min_cardinality: null
model: "FICE"
embedding_dim: 128
random_walk_pe: 0
gradient_clipping: 1.0
prediction_mode: "log-cardinality"
embedding_space: "euclidean"

relation_gnn:
  message_func: "gine"
  source: "factor"
  skip_connection: True 
  layer_norm: True
  dropout: 0.1
  relation_attention: False
  relational: True
  role_aware_degrees: False 

entity_gnn:
  message_func: "gine"
  source: "factor"
  skip_connection: True
  layer_norm: True
  dropout: 0.1

query_gnn:
  message_func: "gine"
  model: "TripleModel"
  skip_connection: False
  readout: "sum"
  layer_norm: True
  dropout: 0.0
  num_layers: 2
  message_activation: "relu"

scheduler:
  enabled: False
  min_lr: 1.0e-6
