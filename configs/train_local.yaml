# Example YAML config for local training (updated to new Config/DataConfig schema)data:
data:
  - dataset: "wn18rr_v4"
    queries: "wn18rr_v4_path_queries"
    batch_size: 8
    num_queries: 1000
    type: "train-val"
epochs: 200
wandb: False
learning_rate: 1e-4
train_ratio: 0.8
output_dir: "output/"
save_every: 5
eval_every: 1
seed: 42
device: "auto"
EntityGNNNeighborhood: [100, 100]
EntityGNNMessageFunc: "gine" # choices are "rotate", "distmult", "transe", "gine" or "GAT" ; first 3 use NBFNet, last one uses custom GNN 
RelationGNNMessageFunc: "GAT" # choices are "rotate", "distmult", "transe", "GAT"
Conditioning: "seed only" # choices are "seed only", "all", "false". False sets all to 0.1; seed only sets seeds to 1 and rest to 0; all sets seeds to 1 and rest to 0.1
min_cardinality: null
QueryGNN: "QueryCardinalityGNN" # choices are "QueryCardinalityGNN", "TripleModel", "QueryTransformer", "SimpleSumGNN"
model: "FICE" # choices are "FICE", "FiceBinary", "FiceIndependent"
layer_norm: False # True or False, whether to use layer normalization in the GNNs
embedding_dim: 128
n_embedding_layers: 2
entity_graph: "bipartite" # choices are "bipartite", "KG"
relation_graph: "bipartite" # choices are "bipartite", "RelationGraph"
# weight_decay: 0.01  # Uncomment to use weight decay
