# Multi-KG inductive ranking-loss training config.
#
# Trains FICE with chain-sampled sibling ranking loss across 9 KGs
# (aids, codex_l, fb237_v4, hetionet, lubm, swdf, wikidata, wn18rr_v4, yago)
# as `train-val`, with DBpedia100k's 8 ranking shapes as `validation` —
# an OOD held-out KG used for monitoring inductive performance during
# training (early stopping / best-checkpoint selection). DBpedia100k is
# NEVER seen during gradient updates.
#
# Train-val coverage (49 (KG, shape) ranking sets generated on coma):
#   aids: 8 shapes (some <100 parents — fine, MultigraphLoader weights by size)
#   codex_l: 7 shapes (snowflake unavailable)
#   fb237_v4: 8 shapes (all at 3000 parents — densest)
#   hetionet: 2 shapes (only star/path raw queries available)
#   lubm: 5 shapes (star/cycle/path missing or builder-failed)
#   swdf: 7 shapes (star failed during build)
#   wikidata: 3 shapes (cycle, star, path; diamond partial)
#   wn18rr_v4: 7 shapes (path_star_ends unavailable)
#   yago: 2 shapes (only star/path raw available)
#
# Inductive validation: 8 dbpedia100k_<shape>_queries_ranking sets (rank_v3
# datasets, 3000 parents each except cycle which is 1010).
#
# Hyperparameters mirror the dbpedia100k ranking-v3 run; only the data
# scale and KG mix differ.

data:

  # ---- aids ----
  - dataset: "aids"
    queries: "aids_star_queries_ranking"
    batch_size: 1
    num_queries: -1
    type: "train-val"
  - dataset: "aids"
    queries: "aids_path_queries_ranking"
