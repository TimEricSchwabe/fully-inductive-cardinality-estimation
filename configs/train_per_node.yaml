# Per-node independent neighborhoods + GBJO-style Graph Transformer (GPS) encoder.
#
# Differences to the legacy joint mode (see train_local.yaml):
# - neighborhood_mode: per_node — every seed node (entity/relation in a query) gets its
#   own precalculated, capped k-hop subgraph, sampled with an RNG seeded by the node id.
#   The subgraph (and its cached RWPE) is identical across batches, epochs and
#   train/test, eliminating the train/test neighborhood mismatch of joint sampling.
# - Monte Carlo sampling: mc_pool_size neighborhoods are precalculated per node;
#   every forward pass (train AND inference) averages the embeddings of mc_samples
#   of them (random subset of the pool in training, fixed subset at eval).
# - relation_gnn.message_func: gps — GPS layers (local GINE + per-subgraph
#   self-attention, as in GBJO's TermEncoder). Attention never crosses subgraphs.

data:
  - dataset: "SWDF"
    queries: "swdf_path_queries"
    batch_size: 2
    num_queries: -1
    type: "train-val"

epochs: 100
wandb: False
learning_rate: 1e-4
train_ratio: 0.8
output_dir: "output/"
save_every: 5
save_metrics_every: 1
eval_every: 1
seed: 42
device: "auto"
weight_decay: 0.00
n_embedding_layers: 4
GNNNeighborhood: [16, 8]  # per-hop neighbor caps of the per-node subgraphs
Conditioning: "seed only"  # in per_node mode the seed flag marks the center node
neighborhood_mode: "per_node"
mc_pool_size: 32  # precalculated neighborhoods per node
mc_samples: 4     # neighborhoods averaged per forward pass (same at train & inference)
min_cardinality: null
model: "FICE"
embedding_dim: 128
random_walk_pe: 8  # RWPE walk length; role-aware (3x dims) on factor graphs; cached per subgraph
gradient_clipping: 1.0
prediction_mode: "log-cardinality"
embedding_space: "euclidean"

entity_gnn:
  message_func: "gine"
  source: "factor"
  skip_connection: True
  layer_norm: True
  dropout: 0.1

# Encoder GNN (GBJO-style Graph Transformer)
relation_gnn:
  message_func: "gps"     # GPS = local GINE + per-subgraph self-attention
  source: "factor"
  skip_connection: True
  layer_norm: True
  dropout: 0.1
  relation_attention: False
  relational: False       # relational GINE takes precedence over gps if True
  role_aware_degrees: True
  heads: 4                # attention heads per GPS layer
  attn_type: "multihead"  # or "performer" (linear attention)
  local_mp: True          # False = attention-only GPS layers

query_gnn:
  message_func: "gine"
  model: "TripleModel"
  skip_connection: False
  readout: "sum"
  layer_norm: True
  dropout: 0.0
  num_layers: 2
  message_activation: "relu"

scheduler:
  enabled: False
  min_lr: 1.0e-6
