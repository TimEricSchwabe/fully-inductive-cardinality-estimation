# Example YAML config for local training

dataset: "SWDF"
queries: "SWDF_Star_Queries"
epochs: 120
batch_size: 32
learning_rate: 1e-4
train_ratio: 0.8
output_dir: "output/"
save_every: 5
eval_every: 1
seed: 42
device: "auto"
DEBUG_num_queries: -1
