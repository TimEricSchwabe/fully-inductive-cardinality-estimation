
data:
  - dataset: "SWDF"
    queries: "SWDF_Star_Queries"
    batch_size: 4
    num_queries: 5000
  - dataset: "LUBM"
    queries: "LUBMQueries"
    batch_size: 4
    num_queries: 5000

epochs: 120
learning_rate: 1e-4
train_ratio: 0.8
output_dir: "output/"
save_every: 5
eval_every: 1
seed: 42
device: "auto"
EntityGNNNeighborhood: [100, 100]
EntityGNNMessageFunc: "gine" # choices are "rotate", "distmult", "transe", "Gine" ; first 3 use NBFNet, last one uses custom GNN 
RelationGNNMessageFunc: "GAT" # choices are "rotate", "distmult", "transe", "GAT"
Conditioning: "all" # choices are "seed only", "all", "false". False sets all to 0.1; seed only sets seeds to 1 and rest to 0; all sets seeds to 1 and rest to 0.1
min_cardinality: None
model: "FiceBinary" # choices are "FICE", "FiceBinary"
# weight_decay: 0.01  # Uncomment to use weight decay


