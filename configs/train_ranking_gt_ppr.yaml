epochs: 50
wandb: true
wandb_run_name: "GT-PPR-multi-kg-ranking-inductive"
learning_rate: 1e-4
train_ratio: 0.8
output_dir: "output/"
save_every: 5
save_metrics_every: 1
eval_every: 1
seed: 42
device: "auto"
weight_decay: 0.0
n_embedding_layers: 4
Conditioning: "false"
min_cardinality: null
model: "FICE"
embedding_dim: 128
gradient_clipping: 1.0
prediction_mode: "log-cardinality"
embedding_space: "euclidean"
count_features: "raw"
disable_embedding_gnn: false

# Ranking Loss Parameters (unchanged from train_ranking_inductive.yaml)
ranking_loss: true
ranking_loss_weight: 3.0
ranking_margin: 0
ranking_group_batch: 2
ranking_loss_type: ranknet
ranking_size_weight_exponent: 1.0
ranking_top_weight_strength: 1.0

# Encoder: winner of the wn18rr_v4 nine-arm comparison (gt_ppr) —
# per-node independent subgraphs, GPS with role-aware RWPE, deterministic
# PPR top-cap neighbor selection. See configs/wn18rr_comparison/gt_ppr.yaml.
neighborhood_mode: "per_node"
GNNNeighborhood: [16, 8]
random_walk_pe: 8
neighbor_selection: "ppr"
ppr_alpha: 0.15
mc_pool_size: 1
mc_samples: 1

entity_gnn:
  message_func: "gine"
  source: "factor"
  skip_connection: True
  layer_norm: True
  dropout: 0.1

relation_gnn:
  message_func: "gps"
  source: "factor"
  skip_connection: True
  layer_norm: True
  dropout: 0.1
  relation_attention: False
  relational: False   # must be off: relational takes precedence over gps
  role_aware_degrees: True
  heads: 4
  attn_type: "multihead"
  local_mp: True

query_gnn:
  message_func: "gine"
  model: "TripleModel"
  skip_connection: False
  readout: "attention"
  layer_norm: True
  dropout: 0.0
  num_layers: 2
  message_activation: "relu"

scheduler:
  enabled: False
  min_lr: 1.0e-6
