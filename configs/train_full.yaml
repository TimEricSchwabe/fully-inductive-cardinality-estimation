# Example YAML config for local training (updated to new Config/DataConfig schema)
data:
  - dataset: "LUBM"
    queries: "LUBMQueries"
    batch_size: &bs 32
    num_queries: &nq 8000
    type: "train-val" # current unseen validation data
  - dataset: "LUBM"
    queries: "lubm_path_queries"
    batch_size: *bs
    num_queries: *nq
    type: "train-val"
  - dataset: "SWDF"
    queries: "SWDF_Star_Queries"
    batch_size: *bs
    num_queries: *nq
    type: "train-val"
  - dataset: "SWDF"
    queries: "swdf_path_queries"
    batch_size: *bs
    num_queries: *nq
    type: "train-val"
  - dataset: "Wikidata"
    queries: "WIKIDATA_Star_Queries"
    batch_size: *bs
    num_queries: *nq
    type: "train-val"
  - dataset: "Wikidata"
    queries: "wikidata_path_queries"
    batch_size: *bs
    num_queries: *nq
    type: "train-val"
  - dataset: "fb237_v4"
    queries: "fb237_v4_star_queries"
    batch_size: *bs
    num_queries: *nq
    type: "train-val"
  - dataset: "fb237_v4"
    queries: "fb237_v4_path_queries"
    batch_size: *bs
    num_queries: *nq
    type: "train-val"
  - dataset: "fb237_v4_ind"
    queries: "fb237_v4_ind_star_queries"
    batch_size: *bs
    num_queries: *nq
    type: "validation"
  - dataset: "fb237_v4_ind"
    queries: "fb237_v4_ind_path_queries"
    batch_size: *bs
    num_queries: *nq
    type: "validation"
  - dataset: "dbpedia100k"
    queries: "dbpedia100k_star_queries"
    batch_size: *bs
    num_queries: *nq
    type: "validation"
  - dataset: "dbpedia100k"
    queries: "dbpedia100k_path_queries"
    batch_size: *bs
    num_queries: *nq
    type: "validation"
  - dataset: "wn18rr_v4"
    queries: "wn18rr_v4_star_queries"
    batch_size: *bs
    num_queries: *nq
    type: "train-val"
  - dataset: "wn18rr_v4"
    queries: "wn18rr_v4_path_queries"
    batch_size: *bs
    num_queries: *nq
    type: "train-val"
  - dataset: "wn18rr_v4_ind"
    queries: "wn18rr_v4_ind_star_queries"
    batch_size: *bs
    num_queries: *nq
    type: "validation"
  - dataset: "wn18rr_v4_ind"
    queries: "wn18rr_v4_ind_path_queries"
    batch_size: *bs
    num_queries: *nq
    type: "validation"


epochs: 20
wandb: False
wandb_run_name: "AutoResearch"
wandb_run_id: "b9588a2d"
learning_rate: 1e-4
train_ratio: 0.8
output_dir: "output/"
save_every: 5
save_metrics_every: 1 # Default from config.py
eval_every: 1
seed: 42
device: "auto"
weight_decay: 0.0
n_embedding_layers: 6
GNNNeighborhood: [100, 100] # Graph Sage numbers
Conditioning: "false" # choices are "seed only", "all", "false". False sets all to 0.1; seed only sets seeds to 1 and rest to 0; all sets seeds to 1 and rest to 0.1
min_cardinality: null # Default from config.py
model: "FICE" # choices are "FICE", "FiceBinary", "FiceIndependent"
embedding_dim: 128
random_walk_pe: 0
gradient_clipping: 1.0
prediction_mode: "log-cardinality" # choices are "log-cardinality" or "log-selectivity"

entity_gnn:
  message_func: "gine" # choices are "gine" or "GAT" or "deepset" or "gps"
  source: "factor" # choices are "KG", "bipartite", "factor"
  skip_connection: True
  layer_norm: True
  dropout: 0.0

relation_gnn:
  message_func: "gine" # choices are "GAT" or "gine" or "deepset" or "gps"
  source: "factor" # choices are "bipartite" or "factor"
  skip_connection: True
  layer_norm: True
  dropout: 0.0

query_gnn:
  message_func: "gine" # choices are "gine" or "deepset" or "deepset"
  model: "TripleModel" # choices are "QueryCardinalityGNN", "TripleModel", "QueryTransformer", "SimpleSumGNN"
  skip_connection: False
  layer_norm: True
  dropout: 0.0
  num_layers: 2

scheduler:
  enabled: True
  min_lr: 1.0e-6
