epochs: 100
wandb: True
wandb_run_name: "skip_connection and layer_norm all with jump"
learning_rate: 1e-4
train_ratio: 0.8
output_dir: "output/"
save_every: 5
save_metrics_every: 1 # Default from config.py
eval_every: 1
seed: 42
device: "auto"
weight_decay: null # Default from config.py defualt is 0.01
n_embedding_layers: 2
GNNNeighborhood: [100, 100]
Conditioning: "false" # choices are "seed only", "all", "false". False sets all to 0.1; seed only sets seeds to 1 and rest to 0; all sets seeds to 1 and rest to 0.1
min_cardinality: null # Default from config.py
model: "FICE" # choices are "FICE", "FiceBinary", "FiceIndependent"
embedding_dim: 128

entity_gnn:
  message_func: "gine" # choices are "gine" or "GAT"
  model: "EntityGNN"
  skip_connection: True
  layer_norm: False

relation_gnn:
  message_func: "gine" # choices are "GAT" or "gine"
  model: "BipartiteGraphGNN"
  skip_connection: True
  layer_norm: False

query_gnn:
  model: "TripleModel" # choices are "QueryCardinalityGNN", "TripleModel", "QueryTransformer", "SimpleSumGNN"
  skip_connection: True
  layer_norm: True
  dropout: 0.2