[project]
name = "fice"
version = "0.1.0"
description = "Fully Inductive Cardinality Estimation (FICE)"
readme = "README.md"
requires-python = ">=3.12"


[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.uv]
index-strategy = "unsafe-best-match"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fice"]
