[project]
name = "fice"
version = "0.1.0"
description = "Fully Inductive Cardinality Estimation (FICE)"
authors = [
    { name = "Lukas Ketzer" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "easydict>=1.13",
    "matplotlib",
    "pandas",
    "pydantic-settings>=2.8.1",
    "torch==2.8.0+cpu",
    "torch-geometric==2.7.0",
    "torchaudio==2.8.0+cpu",
    "torchvision==0.23.0+cpu",
    "wandb>=0.22.3",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.uv]
index-strategy = "unsafe-best-match"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fice"]
