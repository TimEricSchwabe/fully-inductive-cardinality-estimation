
services:
  gcare-benchmark:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gcare-benchmark
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      - DATASET_NAME=wikidata_path
      - DATASET_TYPE=path
      - NUM_QUERIES=500
    volumes:
      # - /path/to/FICE/data/swdf_path_queries/raw/:/usr/src/app/gcare/data/queryset/swdf/
      - /path/to/FICE/benchmarks/gcare/gcare/data/queryset/:/usr/src/app/gcare/data/queryset/
      - /path/to/FICE/benchmarks/gcare/gcare/data/dataset/:/usr/src/app/gcare/data/dataset/
      - ./results/:/usr/src/app/results/
    command: ["sh", "-c", "python3 ./build_statistics.py && python3 ./run_estimation.py"]

